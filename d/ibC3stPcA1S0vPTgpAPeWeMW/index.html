 const flash=()=>{const s=document.getElementById("sv");if(s){s.classList.remove("hidden");setTimeout(()=>s.classList.add("hidden"),1500)}};
 m.querySelectorAll("[data-fc]").forEach(i=>i.onchange=()=>{const v=i.value.trim();const n=parseFloat(v.replace(/[,，¥円\s]/g,""));S.fc[TAB][i.dataset.fc]=v===""||isNaN(n)?null:n/1e6;save();render();flash()});
 m.querySelectorAll("[data-tx]").forEach(i=>i.onchange=()=>{S.txt[TAB][i.dataset.tx]=i.value;save()});
 m.querySelectorAll("[data-st]").forEach(i=>i.onchange=()=>{S.tasks.find(t=>t.id==i.dataset.st).st=i.value;save();render()});
 const na=document.getElementById("na");if(na)na.onclick=()=>{const t=document.getElementById("nt").value.trim();if(!t)return;
  const d=deptOf(TAB);S.tasks.push({id:S.nextId++,t,bu:d.bu,d:[TAB],p:document.getElementById("np").value.trim(),m:"2026/11/27",due:document.getElementById("nd").value,st:"未着手",memo:""});save();render();};}
</script></body></html>
